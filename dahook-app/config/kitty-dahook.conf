# kitty config do modo terminal do dahook (um app so).
# O modo terminal usa kitty REAL, entao TODOS os atalhos do kitty valem.
# Este arquivo importa o default + liga remote control para o Rust esconder/
# mostrar a janela sem abrir outro app.

allow_remote_control yes
listen_on unix:/tmp/dahook-kitty.sock
shell_integration no
window_title dahook — terminal

# Para ver a lista completa de atalhos efetivos:
#   kitty --debug-config
#   kitty +kitten show_key -m kitty
# Referencia gerada do source em ../kitty:
#   ../kitty/kitty/options/definition.py  (map ...)
# Principais (default kitty, nao remapeados aqui):
#   ctrl+shift+t nova aba | ctrl+shift+q fechar | ctrl+shift+enter nova janela
#   ctrl+shift+c copiar | ctrl+shift+v colar | ctrl+shift+f buscar
#   ctrl+shift+igual/- font+ / font- | ctrl+shift+0 reset font
